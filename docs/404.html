<!doctype html>
<html lang="zh-Hans" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · moltdisk</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0C0B09" id="meta-theme">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<script>
(function(){
  try{
    var t = localStorage.getItem('molt.theme');
    if(!t){ t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
    document.documentElement.setAttribute('data-theme', t);
    var l = localStorage.getItem('molt.lang');
    if(l){ document.documentElement.setAttribute('lang', l); if(l === 'ar'){ document.documentElement.setAttribute('dir','rtl'); } }
  }catch(e){}
})();
</script>
<style>
:root{ --paper:#0C0B09; --ink:#EFE8DA; --soft:#928873; --brass:#D9A23C; --rule:rgba(239,232,218,.15);
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",STSong,SimSun,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
html[data-theme="light"]{ --paper:#EFE8DA; --ink:#16130D; --soft:#6E6455; --brass:#9C6A12; --rule:rgba(22,19,13,.17); }
html:lang(ar){ --sans:-apple-system,"Geeza Pro","Noto Naskh Arabic",Tahoma,sans-serif; --serif:"Noto Naskh Arabic",serif; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:32px;
  background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.75;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:68px 68px; background-blend-mode:normal; }
.box{ max-width:560px; width:100%; }
.code{ font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--soft); text-transform:uppercase; }
h1{ font-family:var(--serif); font-weight:600; font-size:clamp(30px,6vw,44px); line-height:1.2; margin:.35em 0 .5em; letter-spacing:-.01em; }
p{ margin:0 0 1.4em; color:var(--ink); }
.mono{ font-family:var(--mono); font-size:.9em; color:var(--soft); }
a.home{ display:inline-flex; align-items:center; gap:10px; font-size:15px; padding:11px 20px; min-height:44px;
  border:1px solid var(--ink); border-radius:2px; color:var(--ink); text-decoration:none; }
a.home:hover{ background:var(--ink); color:var(--paper); }
.sig{ margin-top:26px; font-family:var(--mono); font-size:11.5px; color:var(--soft); border-top:1px solid var(--rule); padding-top:12px; }
</style>
</head>
<body>
<div class="box">
  <div class="code" id="code">404 · not found</div>
  <h1 id="h">这个路径不在规则册里</h1>
  <p id="p">moltdisk 只清点它能证明的东西。这个地址没有证据，所以它不存在。</p>
  <a class="home" id="home" href="./">回到官网</a>
  <div class="sig" id="sig">moltdisk · 蜕冗 — 只审计，不删除</div>
</div>
<script src="assets/i18n.js"></script>
<script>
(function(){
  var I = window.MOLT_I18N || {};
  var root = document.documentElement;
  var D = {
    "zh-Hans": ["这个路径不在规则册里","moltdisk 只清点它能证明的东西。这个地址没有证据，所以它不存在。","回到官网","只审计，不删除"],
    "zh-Hant": ["這個路徑不在規則冊裡","moltdisk 只清點它能證明的东西。這個位址沒有證據，所以它不存在。","回到官網","只審計，不刪除"],
    "en": ["This path is not in the rulebook","moltdisk only lists what it can prove. There is no evidence for this address, so it is not here.","Back to the site","audits, never deletes"],
    "ja": ["このパスはルールブックにありません","moltdisk は証明できるものだけを数えます。このアドレスには根拠がないため、存在しません。","サイトへ戻る","監査のみ、削除しない"],
    "ko": ["이 경로는 규칙서에 없습니다","moltdisk는 증명할 수 있는 것만 셉니다. 이 주소에는 근거가 없으므로 존재하지 않습니다.","사이트로 돌아가기","감사만 하고 삭제하지 않음"],
    "es": ["Esta ruta no está en el reglamento","moltdisk solo enumera lo que puede probar. No hay evidencia de esta dirección, así que no está aquí.","Volver al sitio","audita, nunca borra"],
    "fr": ["Ce chemin n'est pas dans le règlement","moltdisk ne liste que ce qu'il peut prouver. Aucune preuve pour cette adresse : elle n'existe pas.","Retour au site","audite, ne supprime jamais"],
    "de": ["Dieser Pfad steht nicht im Regelwerk","moltdisk listet nur, was es belegen kann. Für diese Adresse gibt es keinen Beleg, also existiert sie nicht.","Zurück zur Seite","prüft, löscht nie"],
    "pt-BR": ["Este caminho não está no regulamento","O moltdisk só lista o que consegue provar. Não há evidência para este endereço, então ele não existe.","Voltar ao site","audita, nunca apaga"],
    "ru": ["Этого пути нет в регламенте","moltdisk перечисляет только то, что может доказать. Для этого адреса доказательств нет, поэтому его не существует.","Вернуться на сайт","проверяет, но не удаляет"],
    "ar": ["هذا المسار ليس في الدفتر","يسرد moltdisk ما يستطيع إثباته فقط. لا دليل على هذا العنوان، لذلك هو غير موجود.","العودة إلى الموقع","يفحص ولا يحذف"],
    "tr": ["Bu yol kural kitabında yok","moltdisk yalnızca kanıtlayabildiğini listeler. Bu adres için kanıt yok, dolayısıyla burada değil.","Siteye dön","denetler, silmez"]
  };
  var saved = null;
  try{ saved = localStorage.getItem('molt.lang'); }catch(e){}
  var code = saved || (navigator.language || 'en');
  var lang = D[code] ? code : null;
  if(!lang){
    var lc = code.toLowerCase();
    if(lc.indexOf('zh') === 0){ lang = (lc.indexOf('hant') > -1 || lc.indexOf('tw') > -1 || lc.indexOf('hk') > -1) ? 'zh-Hant' : 'zh-Hans'; }
    else { lang = Object.keys(D).filter(function(k){ return lc.indexOf(k.toLowerCase().split('-')[0]) === 0; })[0]; }
  }
  if(!lang) lang = 'en';
  var d = D[lang];
  root.setAttribute('lang', lang);
  root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.getElementById('h').textContent = d[0];
  document.getElementById('p').textContent = d[1];
  document.getElementById('home').textContent = d[2];
  document.getElementById('sig').textContent = 'moltdisk · 蜕冗 — ' + d[3];
  var meta = (I[lang] || {}).meta;
  if(meta && meta.title) document.title = '404 · ' + meta.title.split('—')[0].trim();
})();
</script>
</body>
</html>
